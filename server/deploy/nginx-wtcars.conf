# Фрагмент для /etc/nginx/sites-available/publiosmm — вставить внутрь
# существующего server-блока publiosmm.ru (listen 443), рядом с location /api/.
# Сертификат и домен переиспользуются, certbot заново гонять не нужно.
#
# Зону лимита объявить один раз в http-секции /etc/nginx/nginx.conf,
# рядом с publio_api / publio_hook:
#
#     limit_req_zone $binary_remote_addr zone=wt_api:10m rate=10r/s;
#
# Проверить и применить:  nginx -t && systemctl reload nginx

location /wtapi/ {
    limit_req zone=wt_api burst=20 nodelay;

    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Скриншот на распознавание: до 15 МБ (MAX_PHOTO_BYTES) плюс запас на
    # multipart-обвязку. Значение по умолчанию 1 МБ обрезало бы загрузку.
    client_max_body_size 20m;

    # Распознавание на Opus 5 с adaptive thinking идёт десятки секунд —
    # стандартных 60 с не хватит.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
